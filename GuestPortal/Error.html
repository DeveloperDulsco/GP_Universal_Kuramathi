<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png" sizes="32x32">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #37697A url('/assets/images/room-bg.png') no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            position: relative;
            padding-bottom: 56px;
        }
        .header-top {
            background: #fff;
            padding: 1.0em 1.2em;
            text-align: center;
        }
        .header-top img {
            max-width: 220px;
            width: auto;
            height: auto;
            max-height: 72px;
        }
        .thank {
            margin: 80px auto 40px;
            max-width: 720px;
            padding: 4em;
            border-radius: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
        }
        .thank p {
            font-size: 20px;
            color: #333;
            line-height: 1.5;
            margin: 0;
        }
        footer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            text-align: center;
            padding: 12px 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.92);
            background: rgba(0, 0, 0, 0.35);
        }
        @media (max-width: 576px) {
            .thank { margin-top: 40px; padding: 2em 1.4em; }
            .thank p { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="header-top">
        <img src="/assets/images/logo.png" alt="Niva Kuramathi Maldives" />
    </div>
    <div class="thank">
        <p>Something went wrong while processing your request.<br>Please try again later, or contact the front desk if you need help.</p>
    </div>
    <footer>Powered by Dots · © 2026. All rights reserved.</footer>
</body>
</html>
